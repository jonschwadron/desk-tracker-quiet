<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <time id="clock" class="clock" datetime="">—</time>

  <main class="lock">
    <h1 id="hero" class="hero">WAIT</h1>
    <p id="reason" class="reason">—</p>

    <div class="figures" aria-label="desk figures">
      <div class="fig">
        <div id="spot" class="num">—</div>
        <div class="lab">SPOT</div>
        <div id="spot-meta" class="meta">—</div>
      </div>
      <div class="fig">
        <div id="float" class="num">—</div>
        <div class="lab">FLOAT</div>
      </div>
      <div class="fig">
        <div id="ticket" class="num">—</div>
        <div class="lab">TICKET</div>
      </div>
      <div class="fig">
        <div id="risk" class="num">—</div>
        <div class="lab">RISK</div>
      </div>
    </div>

    <p id="m30" class="whisper">—</p>
    <p id="fvg" class="whisper">—</p>
    <p id="sl" class="whisper sl">—</p>

    <ol id="feed" class="feed"></ol>
  </main>

  <script src="app.js"></script>
</body>
</html>
